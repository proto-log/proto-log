        <style>
            @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik+Glitch&display=swap');
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            a,a:link,a:visited {
                color: inherit;
                text-decoration: none;
            }
            li {
                list-style: none;
            }
            .container {
                width: 1140px;
                margin: 0 auto;
                border-top: 1px solid #01f7fa;
                border-bottom: 1px solid #ff0dff;
                padding-right: 1rem;
            }
            .aaaaa {
                width: 1536.4000px;
                margin: 0 auto;
                margin-left: 0px;
                margin-right: 0px;
                font-family: 'Press Start 2P';
            }
            header {
                position: fixed;
                color: #fff;
                top: 0;
                z-index: 1;
                width: 100%;
                background-color: #222;
            }
            header .container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                padding: 10px;
            }
            header nav ul {
                display: flex;
            }
            header nav ul li {
                padding: 15px;
            }
            header button {
                background: transparent;
                border: 0;
                cursor: pointer;
            }
            header button h1 {
                font-size: 2rem;
                font-weight: bold;
                color: #fff;
                font-family: 'Press Start 2P';
                font-variant: small-caps;
            }
            header nav ul li button {
                font-size: 1.2rem;
                color: #fff;
            }
            .mega-dropdown {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                height: 0;
                overflow: hidden;
                background-color: #222;
                border-bottom: 0px solid #ff0dff;
                transition: height 0.3s ease, border-bottom 0.1s ease;
            }
            header .container:hover .mega-dropdown {
                height: 130px;
                border-bottom: 2px solid #01f7fa;
            }
            .mega-content {
                display: flex;
                justify-content: flex-end;
                width: 100%;
                padding-top: 6px;
            }
            .sub-menu-group {
                display: flex;
                flex-direction: column;
                width: 160px;
                text-align: center;
                margin-right: 60px;
            }
            .sub-menu-group li button {
                width: 100%;
                padding: 6px 0;
                font-size: 0.9rem;
                color: #aaa;
            }
            .sub-menu-group li button:hover {
                color: #01f7fa;
            }
            main {
                width: 100%;
                height: 100vh;
                color: #fff;
                background: linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.8)),url('proto-log.png') center center;
                background-size: cover;
                display: flex;
                justify-content: center;
                align-items: center;
                text-align: center;
            }
            main h4 {
                font-size: 2rem;
            }
            main h2 {
                font-size: 3.5rem;
                margin: 2rem 0;
                letter-spacing: 3px;
            }
            main p {
                max-width: 500px;
                margin: 0 auto;
                font-size: 1.25rem;
            }
            #asdfg {
                margin: 0px;
                padding-top: 20px;
            }
            #tc1 {
                color: #ff0dff;
            }
            #tc2 {
                color: #01f7fa;
            }
            #b1 {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            #b1 h1 {
                display: flex;
                align-items: baseline;
                margin: 0;
                white-space: nowrap;
            }
            #b1 p {
                display: inline;
                margin: 0;
            }
            .fa-brandsfa-youtube {
                width: 20px;
                height: 20px;
            }
            .tiktok {
                width: 20px;
                height: 20px;
            }
            header button:hover {

            }

            }
            #memberList {
                width: 133px; 
                margin-right: 0px;
            }
            #games {

                margin-right: 5px;
            }
